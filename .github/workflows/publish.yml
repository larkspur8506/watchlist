name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/watchlist:sha-${{ steps.meta.outputs.short }}
            ghcr.io/${{ github.repository_owner }}/watchlist:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run image and probe /health
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/watchlist:latest
          docker run -d --name wl -e WATCH_PORT=8130 -p 8130:8130 \
            ghcr.io/${{ github.repository_owner }}/watchlist:latest
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8130/health || true)
            echo "try $i -> $code"; [ "$code" = "200" ] && break; sleep 2
          done
          docker logs wl
          [ "$code" = "200" ] || exit 1
          # 页面与静态资源可访问性（无 token 时应 401）
          echo "no-token / => $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8130/)"
