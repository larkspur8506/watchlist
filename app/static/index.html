<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<title>自选</title>
<link rel="stylesheet" href="/app.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="自选">

<body>
<header class="hd">
  <div class="hd-l">
    <h1>自选</h1>
    <span id="stamp" class="stamp">—</span>
  </div>
  <div class="hd-r">
    <span id="dot" class="dot" title="数据源状态"></span>
    <button id="refresh" class="iconbtn" aria-label="刷新">⟳</button>
  </div>
</header>

<main id="list" class="list"><div class="loading">加载中…</div></main>

<footer class="ft">
  <span class="sum"><b id="up">0</b> 涨</span>
  <span class="sum"><b id="down">0</b> 跌</span>
  <span class="sum"><b id="flat">0</b> 平</span>
  <span id="note" class="note"></span>
</footer>

<script src="/app.js"></script>

</html>
